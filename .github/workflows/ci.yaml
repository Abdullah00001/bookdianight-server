name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Scheduler Service
        run: |
          cd scheduler
          npm install
          cp -r ../prisma ./
          npx prisma generate
          npm run build

      - name: Build Worker Service
        run: |
          cd worker
          npm install
          cp -r ../prisma ./
          npx prisma generate
          npm run build

      - name: Build Server Service
        run: |
          cd server
          npm install
          cp -r ../prisma ./
          npx prisma generate
          npm run build
