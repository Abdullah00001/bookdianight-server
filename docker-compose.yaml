services:
  # External Dependency
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bookdianight-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: myStrongPassword
      POSTGRES_DB: bookdianight
    ports:
      - 5440:5432
    networks:
      - bookdianight-network
    volumes:
      - bookdianight-postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:latest
    container_name: bookdianight-redis
    command: redis-server --requirepass myStrongPassword
    ports:
      - 6382:6379
    networks:
      - bookdianight-network
    volumes:
      - bookdianight-redis-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myStrongPassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      - postgres
  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: bookdianight-redis-ui
    environment:
      # Format: connectionName:host:port:dbIndex:password
      - REDIS_HOSTS=local:redis:6379:0:myStrongPassword
      # This helps the UI start even if it takes a second to find the redis container
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
    ports:
      - 8083:8081
    networks:
      - bookdianight-network
    depends_on:
      - redis

  # Core Services
  scheduler:
    container_name: bookdianight-scheduler
    build:
      context: .
      dockerfile: "./scheduler/Dockerfile.dev"
    env_file: ".env"
    environment:
      - DATABASE_URL=postgresql://postgres:myStrongPassword@postgres:5432/bookdianight?schema=public
    volumes:
      - ./scheduler:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    networks:
      - bookdianight-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps -ef | grep -q '[n]odemon' || ps -ef | grep -q '[n]ode .*dist/index.js'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  worker:
    container_name: bookdianight-worker
    build:
      context: .
      dockerfile: "./worker/Dockerfile.dev"
    env_file: ".env"
    environment:
      - DATABASE_URL=postgresql://postgres:myStrongPassword@postgres:5432/bookdianight?schema=public
    volumes:
      - ./worker:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    networks:
      - bookdianight-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps -ef | grep -q '[n]odemon' || ps -ef | grep -q '[n]ode .*dist/index.js'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  server:
    container_name: bookdianight-server
    build:
      context: .
      dockerfile: "./server/Dockerfile.dev"
    env_file: ".env"
    environment:
      - DATABASE_URL=postgresql://postgres:myStrongPassword@postgres:5432/bookdianight?schema=public
    ports:
      - 5005:5000
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    networks:
      - bookdianight-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps -ef | grep -q '[n]odemon' || ps -ef | grep -q '[n]ode .*dist/server.js'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
networks:
  bookdianight-network:
    driver: bridge

volumes:
  bookdianight-postgres-volume:
  bookdianight-redis-volume:
