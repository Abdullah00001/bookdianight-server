openapi: 3.0.3
info:
  title: BookDiaNight API
  version: 1.0.0
  description: API documentation for the BookDiaNight backend.
servers:
  - url: https://bookdianight.localbox.online
    description: Local development server
  - url: https://api.bookdianight.com
    description: Production server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication and device management endpoints
  - name: Media
    description: Public media and file upload endpoints
  - name: Club
    description: Club management endpoints
  - name: Event
    description: Event management endpoints
  - name: Explore
    description: Public exploration endpoints
  - name: Wishlist
    description: User wishlist management endpoints
  - name: Connect
    description: Stripe Connect onboarding, callback, and webhook endpoints
  - name: Purchase
    description: Payment-ready pending Club and Event purchase creation
  - name: Recover
    description: Account recovery endpoints
  - name: Admin Auth
    description: Admin authentication endpoints
  - name: Profile
    description: User profile endpoints
  - name: Admin Legal
    description: Admin legal endpoints
  - name: Public Legal
    description: Public Legal endpoints
components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.

        Note: The `/auth/verify` and `/auth/resend` endpoints expect the
        OTP-page pending verification token,

        whereas `/auth/check` expects the standard user access token.

        '
  schemas:
    CreateWishlistPayload:
      type: object
      required:
        - type
        - targetId
      properties:
        type:
          type: string
          enum:
            - CLUB
            - EVENT
        targetId:
          type: string
          format: uuid

    GetWishlistResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            meta:
              $ref: '#/components/schemas/ExplorePaginationMeta'
            data:
              type: array
              description: >
                Array of saved items. The exact shape depends on the target type.
                Stale records (deactivated Clubs, non-UPCOMING Events, deactivated Events) are excluded.
                Ordered by wishlist creation time descending.
              items:
                oneOf:
                  - $ref: '#/components/schemas/ExploreClubListItem'
                  - $ref: '#/components/schemas/ExploreEventListItem'

    ClubOpeningHourPayload:
      type: object
      required:
        - dayOfWeek
        - isClosed
        - closesNextDay
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        isClosed:
          type: boolean
        openTime:
          type: string
          format: date-time
          nullable: true
        closeTime:
          type: string
          format: date-time
          nullable: true
        closesNextDay:
          type: boolean
    ClubPackagePayload:
      type: object
      required:
        - name
        - capacity
        - price
        - currency
        - features
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
          default: 0
    CreateClubPayload:
      type: object
      required:
        - name
        - thumbnail
        - images
        - dressCode
        - isRecurring
        - lat
        - lng
        - location
        - openingHours
        - packages
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
          default: false
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        location:
          type: string
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/ClubOpeningHourPayload'
          minItems: 7
          maxItems: 7
        packages:
          type: array
          description: List of packages. All packages within a club MUST share the exact same currency string. Mixed currencies will result in a 422 validation error.
          items:
            $ref: '#/components/schemas/ClubPackagePayload'
    UpdateClubOpeningHourPayload:
      allOf:
        - $ref: '#/components/schemas/ClubOpeningHourPayload'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    UpdateClubPackagePayload:
      allOf:
        - $ref: '#/components/schemas/ClubPackagePayload'
        - type: object
          required:
            - id
            - isActive
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean
    UpdateClubPayload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        location:
          type: string
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/UpdateClubOpeningHourPayload'
          minItems: 7
          maxItems: 7
        packages:
          type: array
          description: List of packages to update. All packages within a club MUST share the exact same currency string. Mixed currencies will result in a 422 validation error.
          items:
            $ref: '#/components/schemas/UpdateClubPackagePayload'
    ExplorePaginationMetaLinks:
      type: object
      required:
        - currentPage
        - nextPage
        - previousPage
        - firstPage
        - lastPage
      properties:
        currentPage:
          type: string
          format: uri
        nextPage:
          type: string
          format: uri
          nullable: true
        previousPage:
          type: string
          format: uri
          nullable: true
        firstPage:
          type: string
          format: uri
        lastPage:
          type: string
          format: uri
    ExplorePaginationMeta:
      type: object
      required:
        - total
        - totalPages
        - links
      properties:
        total:
          type: integer
        totalPages:
          type: integer
        links:
          $ref: '#/components/schemas/ExplorePaginationMetaLinks'
    ExploreClubListItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - location
        - type
        - review
        - isVip
        - thumbnail
        - priceRange
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        type:
          type: string
          enum:
            - CLUB
        review:
          type: number
        isVip:
          type: boolean
        thumbnail:
          type: string
          format: uri
        priceRange:
          type: object
          required:
            - minPrice
            - maxPrice
          properties:
            minPrice:
              type: number
              description: The minimum package price derived strictly from ACTIVE packages. If a club has no active packages, this fallback value is 0.
            maxPrice:
              type: number
              description: The maximum package price derived strictly from ACTIVE packages. If a club has no active packages, this fallback value is 0.
          description: Object containing the minimum and maximum package prices for the club.
        currency:
          type: string
          description: The single shared currency derived strictly from ACTIVE packages. If a club has no active packages, this fallback value is an empty string "".
        isWishlist:
          type: boolean
          description: Whether the club is saved in the authenticated user's wishlist. Omitted for guest requests.
    ExploreEventListItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - location
        - type
        - thumbnail
        - price
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        type:
          type: string
          enum:
            - EVENT
        thumbnail:
          type: string
          format: uri
        price:
          type: number
        currency:
          type: string
        isWishlist:
          type: boolean
          description: Whether the event is saved in the authenticated user's wishlist. Omitted for guest requests.
    ExploreClubDetailOpeningHour:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
        isClosed:
          type: boolean
        openTime:
          type: string
          format: date-time
          nullable: true
        closeTime:
          type: string
          format: date-time
          nullable: true
        closesNextDay:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExploreClubDetailPackage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
        price:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExploreClubDetailResponse:
      type: object
      required:
        - id
        - name
        - thumbnail
        - images
        - dressCode
        - isRecurring
        - isVip
        - lat
        - lng
        - location
        - totalReviews
        - clubOpeningHours
        - clubPackages
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        totalReviews:
          type: integer
        clubOpeningHours:
          type: array
          items:
            $ref: '#/components/schemas/ExploreClubDetailOpeningHour'
        clubPackages:
          type: array
          items:
            $ref: '#/components/schemas/ExploreClubDetailPackage'
        isWishlist:
          type: boolean
          description: Whether the club is saved in the authenticated user's wishlist. Omitted for guest requests.
    ExploreEventDetailResponse:
      type: object
      required:
        - id
        - eventName
        - thumbnail
        - images
        - eventStatus
        - lat
        - lng
        - location
        - startAt
        - endAt
        - dressCode
        - eventPrice
        - currency
      properties:
        id:
          type: string
          format: uuid
        eventName:
          type: string
        eventDescription:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        eventStatus:
          type: string
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        dressCode:
          type: string
        eventPrice:
          type: number
        currency:
          type: string
        isWishlist:
          type: boolean
          description: Whether the event is saved in the authenticated user's wishlist. Omitted for guest requests.
    ChangePasswordPayload:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          minLength: 6
        newPassword:
          type: string
          minLength: 6
        confirmPassword:
          type: string
          minLength: 6
    UpdateCommissionPayload:
      type: object
      required:
        - serviceType
        - chargePercentage
      properties:
        serviceType:
          type: string
          enum: [EVENT, CLUB]
        chargePercentage:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Decimal commission percentage with up to two decimal places.
          example: 20.25
    ClubPurchaseRequest:
      type: object
      required: [clubPackageId, startAt, endAt, guestCount]
      properties:
        clubPackageId: { type: string, format: uuid }
        startAt:
          {
            type: string,
            format: date-time,
            description: Fixed CST wall-clock ISO-8601 value with required -06:00 offset.,
          }
        endAt:
          {
            type: string,
            format: date-time,
            description: Fixed CST wall-clock ISO-8601 value with required -06:00 offset.,
          }
        guestCount: { type: integer, minimum: 1 }
    EventPurchaseFriend:
      type: object
      required: [name, phoneNumber, gender, age]
      properties:
        name: { type: string }
        phoneNumber: { type: string }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        age: { type: integer, minimum: 1 }
        image: { type: string, format: uri }
    EventPurchaseRequest:
      type: object
      required: [eventId]
      properties:
        eventId: { type: string, format: uuid }
        friends:
          {
            type: array,
            maxItems: 4,
            items: { $ref: '#/components/schemas/EventPurchaseFriend' },
          }
    UpdateServiceChargePayload:
      type: object
      additionalProperties: false
      required:
        - amount
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          maximum: 99999999.99
          multipleOf: 0.01
          description: Fixed global Service Charge amount. Must be greater than 0.00 and have no more than two decimal places.
          example: 5.5
    ServiceCharge:
      type: object
      required:
        - id
        - amount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          enum: [GLOBAL]
          description: The fixed singleton identifier for the global configuration.
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Fixed global Service Charge amount. No currency is stored with this configuration.
          example: 5.5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CheckAccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User is authenticated
        traceId:
          type: string
          format: uuid
        data:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            avatar:
              type: string
              nullable: true
              example: https://example.com/avatar.jpg
            role:
              type: string
              example: USER
            accountStatus:
              type: string
              example: ACTIVE
      required:
        - success
        - message
        - traceId
    FindRecoverUserByEmailPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyRecoverUserOtpPayload:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: '123456'
          description: 6-digit numeric OTP
    ResetRecoverUserPasswordPayload:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: newStrongPassword123!
          description: Minimum 6 characters
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
                format: uri
              description: Array of S3 URLs for uploaded files
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Server Is Running
        dependencies:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        traceId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_BLOCKED
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    SignupPayload:
      type: object
      required:
        - role
        - name
        - email
        - phoneNumber
        - location
        - password
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        role:
          type: string
          enum:
            - CLUB_OWNER
            - USER
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          minLength: 5
        location:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6
        deviceIdentifier:
          type: string
          minLength: 1
        fcmToken:
          type: string
        lat:
          type: number
        lng:
          type: number
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date-time
    LoginPayload:
      type: object
      required:
        - email
        - password
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        email:
          type: string
          format: email
          example: xopoxe8124@hebase.com
        password:
          type: string
          minLength: 6
          example: 12345678aA
        deviceIdentifier:
          type: string
          minLength: 1
          example: zZp|6sBQ<Ca2_=Kl]J7jt:Mvz{n9VT$v
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: ANDROID
        fcmToken:
          type: string
          example: fcm_token_sample_abc123_def456_ghi789_jkl012_mno345_pqr678_stu901_vwx234_yz5678_ABCDEF_GHIJKL_MNOPQR_STUVWX_YZ
        rememberMe:
          type: boolean
          default: false
          example: true
        lng:
          type: number
          format: double
          example: -71.935353
        lat:
          type: number
          format: double
          example: -15.315821
    VerifySignupPayload:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d+$
        deviceIdentifier:
          type: string
          minLength: 1
        fcmToken:
          type: string
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
    LogoutPayload:
      type: object
      required:
        - deviceIdentifier
      properties:
        deviceIdentifier:
          type: string
          minLength: 1
          description:
            Client-generated app-installation identifier used to validate the
            authenticated device context.
    CheckAccessPayload:
      type: object
      required:
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        deviceIdentifier:
          type: string
          minLength: 1
        lat:
          type: number
        lng:
          type: number
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        fcmToken:
          type: string
    DeleteMediaPayload:
      type: object
      required:
        - urls
      properties:
        urls:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
    AdminLoginPayload:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    AdminAuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserResponse'
        csrfToken:
          type: string
          description:
            CSRF token provided for easier Swagger testing. Usually sent via
            cookie.
        traceId:
          type: string
          format: uuid
    AdminUserResponse:
      type: object
      required:
        - id
        - name
        - email
        - phoneNumber
        - accountStatus
        - accountRole
        - isVerified
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
        accountRole:
          type: string
          enum:
            - USER
            - ADMIN
            - CLUB_OWNER
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfilePayload:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        phoneNumber:
          type: string
          example: '+1234567890'
        location:
          type: string
          example: New York, USA
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
          example: MALE
        dateOfBirth:
          type: string
          format: date-time
          example: '1990-01-01T00:00:00.000Z'
        profileAvatar:
          type: string
          format: uri
          example: https://example.com/avatar.jpg
        profileCover:
          type: string
          format: uri
          example: https://example.com/cover.jpg
    AdminUpdateProfilePayload:
      type: object
      properties:
        name:
          type: string
          example: Admin User
        phoneNumber:
          type: string
          example: '+1234567890'
        profileAvatar:
          type: string
          format: uri
          example: https://example.com/admin-avatar.jpg
    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Profile retrieved successfully
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                accountStatus:
                  type: string
                accountRole:
                  type: string
                isVerified:
                  type: boolean
                profile:
                  type: object
                  properties:
                    location:
                      type: string
                      nullable: true
                    gender:
                      type: string
                      nullable: true
                    dateOfBirth:
                      type: string
                      format: date-time
                      nullable: true
                    profileAvatar:
                      type: string
                      nullable: true
