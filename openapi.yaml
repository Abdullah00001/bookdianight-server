openapi: 3.0.3
info:
  title: BookDiaNight API
  version: 1.0.0
  description: API documentation for the BookDiaNight backend.
servers:
  - url: http://localhost:5005
    description: Local development server
  - url: https://petition-orchestra-awards-adaptor.trycloudflare.com
    description: TryCloudflare server (temporary)
  - url: https://api.bookdianight.com
    description: Production server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication and device management endpoints
  - name: Media
    description: Public media and file upload endpoints
  - name: Club
    description: Club management endpoints
  - name: Event
    description: Event management endpoints
  - name: Explore
    description: Public exploration endpoints
components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.

        Note: The `/auth/verify` and `/auth/resend` endpoints expect the
        OTP-page pending verification token,

        whereas `/auth/check` expects the standard user access token.

        '
  schemas:

    ClubOpeningHourPayload:
      type: object
      required:
        - dayOfWeek
        - isClosed
        - closesNextDay
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        isClosed:
          type: boolean
        openTime:
          type: string
          format: date-time
          nullable: true
        closeTime:
          type: string
          format: date-time
          nullable: true
        closesNextDay:
          type: boolean
    ClubPackagePayload:
      type: object
      required:
        - name
        - capacity
        - price
        - currency
        - features
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
          default: 0
    CreateClubPayload:
      type: object
      required:
        - name
        - thumbnail
        - images
        - dressCode
        - isRecurring
        - lat
        - lng
        - openingHours
        - packages
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
          default: false
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/ClubOpeningHourPayload'
          minItems: 7
          maxItems: 7
        packages:
          type: array
          items:
            $ref: '#/components/schemas/ClubPackagePayload'
    UpdateClubOpeningHourPayload:
      allOf:
        - $ref: '#/components/schemas/ClubOpeningHourPayload'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    UpdateClubPackagePayload:
      allOf:
        - $ref: '#/components/schemas/ClubPackagePayload'
        - type: object
          required:
            - id
            - isActive
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean
    UpdateClubPayload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/UpdateClubOpeningHourPayload'
          minItems: 7
          maxItems: 7
        packages:
          type: array
          items:
            $ref: '#/components/schemas/UpdateClubPackagePayload'
    ExplorePaginationMetaLinks:
      type: object
      required:
        - currentPage
        - nextPage
        - previousPage
        - firstPage
        - lastPage
      properties:
        currentPage:
          type: string
          format: uri
        nextPage:
          type: string
          format: uri
          nullable: true
        previousPage:
          type: string
          format: uri
          nullable: true
        firstPage:
          type: string
          format: uri
        lastPage:
          type: string
          format: uri
    ExplorePaginationMeta:
      type: object
      required:
        - total
        - totalPages
        - links
      properties:
        total:
          type: integer
        totalPages:
          type: integer
        links:
          $ref: '#/components/schemas/ExplorePaginationMetaLinks'
    ExploreClubListItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - type
        - review
        - isVip
        - thumbnail
        - minPrice
        - maxPrice
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        type:
          type: string
          enum:
            - CLUB
        review:
          type: number
        isVip:
          type: boolean
        thumbnail:
          type: string
          format: uri
        minPrice:
          type: number
        maxPrice:
          type: number
        currency:
          type: string
    ExploreEventListItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - type
        - thumbnail
        - price
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        type:
          type: string
          enum:
            - EVENT
        thumbnail:
          type: string
          format: uri
        price:
          type: number
        currency:
          type: string
    ExploreClubDetailOpeningHour:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
        isClosed:
          type: boolean
        openTime:
          type: string
          format: date-time
          nullable: true
        closeTime:
          type: string
          format: date-time
          nullable: true
        closesNextDay:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExploreClubDetailPackage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
        price:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExploreClubDetailResponse:
      type: object
      required:
        - id
        - name
        - thumbnail
        - images
        - dressCode
        - isRecurring
        - isVip
        - lat
        - lng
        - totalReviews
        - clubOpeningHours
        - clubPackages
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        lat:
          type: number
        lng:
          type: number
        totalReviews:
          type: integer
        clubOpeningHours:
          type: array
          items:
            $ref: '#/components/schemas/ExploreClubDetailOpeningHour'
        clubPackages:
          type: array
          items:
            $ref: '#/components/schemas/ExploreClubDetailPackage'
    ExploreEventDetailResponse:
      type: object
      required:
        - id
        - eventName
        - thumbnail
        - images
        - eventStatus
        - lat
        - lng
        - startAt
        - endAt
        - dressCode
        - eventPrice
        - currency
      properties:
        id:
          type: string
          format: uuid
        eventName:
          type: string
        eventDescription:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        eventStatus:
          type: string
        lat:
          type: number
        lng:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        dressCode:
          type: string
        eventPrice:
          type: number
        currency:
          type: string
    ChangePasswordPayload:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          minLength: 6
        newPassword:
          type: string
          minLength: 6
        confirmPassword:
          type: string
          minLength: 6
    UpdateCommissionPayload:
      type: object
      required:
        - serviceType
        - chargePercentage
      properties:
        serviceType:
          type: string
          enum: [ EVENT, CLUB ]
        chargePercentage:
          type: number
    CheckAccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User is authenticated
        traceId:
          type: string
          format: uuid
        data:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            avatar:
              type: string
              nullable: true
              example: https://example.com/avatar.jpg
            role:
              type: string
              example: USER
            accountStatus:
              type: string
              example: ACTIVE
      required:
        - success
        - message
        - traceId
    FindRecoverUserByEmailPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyRecoverUserOtpPayload:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: '123456'
          description: 6-digit numeric OTP
    ResetRecoverUserPasswordPayload:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: newStrongPassword123!
          description: Minimum 6 characters
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
                format: uri
              description: Array of S3 URLs for uploaded files
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Server Is Running
        dependencies:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        traceId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_BLOCKED
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    SignupPayload:
      type: object
      required:
        - role
        - name
        - email
        - phoneNumber
        - location
        - password
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        role:
          type: string
          enum:
            - CLUB_OWNER
            - USER
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          minLength: 5
        location:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6
        deviceIdentifier:
          type: string
          minLength: 1
        fcmToken:
          type: string
        lat:
          type: number
        lng:
          type: number
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date-time
    LoginPayload:
      type: object
      required:
        - email
        - password
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        email:
          type: string
          format: email
          example: xopoxe8124@hebase.com
        password:
          type: string
          minLength: 6
          example: 12345678aA
        deviceIdentifier:
          type: string
          minLength: 1
          example: zZp|6sBQ<Ca2_=Kl]J7jt:Mvz{n9VT$v
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: ANDROID
        fcmToken:
          type: string
          example: fcm_token_sample_abc123_def456_ghi789_jkl012_mno345_pqr678_stu901_vwx234_yz5678_ABCDEF_GHIJKL_MNOPQR_STUVWX_YZ
        rememberMe:
          type: boolean
          default: false
          example: true
        lng:
          type: number
          format: double
          example: -71.935353
        lat:
          type: number
          format: double
          example: -15.315821
    VerifySignupPayload:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d+$
        deviceIdentifier:
          type: string
          minLength: 1
        fcmToken:
          type: string
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
    LogoutPayload:
      type: object
      required:
        - deviceIdentifier
      properties:
        deviceIdentifier:
          type: string
          minLength: 1
          description: Client-generated app-installation identifier used to validate the
            authenticated device context.
    CheckAccessPayload:
      type: object
      required:
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        deviceIdentifier:
          type: string
          minLength: 1
        lat:
          type: number
        lng:
          type: number
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        fcmToken:
          type: string
    DeleteMediaPayload:
      type: object
      required:
        - urls
      properties:
        urls:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
    AdminLoginPayload:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    AdminAuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserResponse'
        csrfToken:
          type: string
          description: CSRF token provided for easier Swagger testing. Usually sent via
            cookie.
        traceId:
          type: string
          format: uuid
    AdminUserResponse:
      type: object
      required:
        - id
        - name
        - email
        - phoneNumber
        - accountStatus
        - accountRole
        - isVerified
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
        accountRole:
          type: string
          enum:
            - USER
            - ADMIN
            - CLUB_OWNER
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfilePayload:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        phoneNumber:
          type: string
          example: '+1234567890'
        location:
          type: string
          example: New York, USA
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
          example: MALE
        dateOfBirth:
          type: string
          format: date-time
          example: '1990-01-01T00:00:00.000Z'
        profileAvatar:
          type: string
          format: uri
          example: https://example.com/avatar.jpg
        profileCover:
          type: string
          format: uri
          example: https://example.com/cover.jpg
    AdminUpdateProfilePayload:
      type: object
      properties:
        name:
          type: string
          example: Admin User
        phoneNumber:
          type: string
          example: '+1234567890'
        profileAvatar:
          type: string
          format: uri
          example: https://example.com/admin-avatar.jpg
    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Profile retrieved successfully
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                accountStatus:
                  type: string
                accountRole:
                  type: string
                isVerified:
                  type: boolean
                profile:
                  type: object
                  properties:
                    location:
                      type: string
                      nullable: true
                    gender:
                      type: string
                      nullable: true
                    dateOfBirth:
                      type: string
                      format: date-time
                      nullable: true
                    profileAvatar:
                      type: string
                      nullable: true
                    profileCover:
                      type: string
                      nullable: true
                    id:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
        traceId:
          type: string
          format: uuid
    AdminProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Admin profile retrieved successfully
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                accountStatus:
                  type: string
                accountRole:
                  type: string
                isVerified:
                  type: boolean
                profile:
                  type: object
                  properties:
                    location:
                      type: string
                      nullable: true
                    gender:
                      type: string
                      nullable: true
                    dateOfBirth:
                      type: string
                      format: date-time
                      nullable: true
                    profileAvatar:
                      type: string
                      nullable: true
                    profileCover:
                      type: string
                      nullable: true
                    id:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
        traceId:
          type: string
          format: uuid
    LegalContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legalContentType:
          type: string
          enum:
            - TERMS_AND_CONDITION
            - PRIVACY_AND_POLICY
            - ABOUT_US
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateLegalContentPayload:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
    LegalContentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Legal content retrieved successfully
        data:
          type: object
          properties:
            legalContent:
              $ref: "#/components/schemas/LegalContent"
        traceId:
          type: string
          format: uuid
    ClubListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        meta:
          $ref: "#/components/schemas/ExplorePaginationMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClubDetailPayload"
        traceId:
          type: string
          format: uuid
    ClubDetailPayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        lat:
          type: number
        lng:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
        clubOpeningHours:
          type: array
          items:
            $ref: "#/components/schemas/UpdateClubOpeningHourPayload"
        clubPackages:
          type: array
          items:
            $ref: "#/components/schemas/UpdateClubPackagePayload"
    ClubDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ClubDetailPayload"
        traceId:
          type: string
          format: uuid
    CreateClubResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
              nullable: true
            thumbnail:
              type: string
              format: uri
            images:
              type: array
              items:
                type: string
                format: uri
            dressCode:
              type: string
            isRecurring:
              type: boolean
            isVip:
              type: boolean
            lat:
              type: number
            lng:
              type: number
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            deactivatedAt:
              type: string
              format: date-time
              nullable: true
        traceId:
          type: string
          format: uuid
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Reports the health status of the application and its dependencies
        (Database, Redis).
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: User signup
      description: 'creates a new user account

        validates the submitted registration information

        creates the pending verification state

        generates the verification OTP flow

        returns the OTP-page/pending-verification token

        does not issue a normal authenticated access token until verification
        succeeds

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupPayload'
      responses:
        '201':
          description: Signup successful, OTP email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User with this email already exist
                errorType: USER_ALREADY_EXISTS
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        authenticates using email/password

        requires the app's deviceIdentifier

        resolves/registers the device after successful authentication

        supports multiple devices for the same account

        optionally updates FCM token information

        returns an access JWT for verified users

        uses the existing remember-me behavior

        (7-day token if rememberMe is false, 30-day token if rememberMe is true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login successful. Returns access token or OTP pending token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 'Internal Service Errors (Currently thrown as native Errors caught
            by global 500 handler).

            Includes: "Invalid credentials", "Account is blocked or inactive".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP
      security:
        - bearerAuth: []
      description: 'this endpoint uses the pending OTP verification token

        validates the OTP

        establishes the device relationship

        issues the normal access token after successful verification

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignupPayload'
      responses:
        '200':
          description: OTP Verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized. OTP is invalid, expired, or token missing/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: OTP Expired
                errorType: OTP_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/resend:
    post:
      tags:
        - Auth
      summary: Resend OTP
      security:
        - bearerAuth: []
      description: 'it requires the pending OTP verification token

        generates/sends another verification OTP

        does not issue an access token

        '
      responses:
        '200':
          description: OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token is missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: Token Expired
                errorType: TOKEN_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/check:
    post:
      tags:
        - Auth
      summary: Check Access Token
      security:
        - bearerAuth: []
      description: 'it validates the access token

        validates the JWT/device relationship

        validates the submitted deviceIdentifier

        updates device activity according to the existing implementation

        does not create/reassign device ownership

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAccessPayload'
      responses:
        '200':
          description: User is authenticated and device context is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAccessResponse'
        '401':
          description: Unauthorized. Token missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: Token Expired
                errorType: TOKEN_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Invalid device context, blocked account, or other internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media:
    post:
      tags:
        - Media
      summary: Upload Media
      description: 'multipart file upload

        accepted field name is "files"

        number of files: up to 10

        per-file size limit: 50MB

        accepted MIME categories: standard images, videos, audio, and documents

        returned media URLs

        **Security Warning:** This route is currently PUBLIC and requires no
        authentication.

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  description: Array of files to upload. Max 10. Max 50MB per file.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '400':
          description: Multer Upload Error (File size exceeded, unexpected field, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                  traceId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Media
      summary: Delete Media
      description: 'deletes the supplied media objects/URLs

        request structure expects a JSON array of URLs

        current authentication state is PUBLIC

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMediaPayload'
      responses:
        '200':
          description: Media items deletion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recover/find:
    post:
      tags:
        - Recover
      summary: Find user by email and send OTP
      description: Validates email, checks account status, generates OTP, and sends it
        via email queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindRecoverUserByEmailPayload'
      responses:
        '200':
          description: Success. OTP sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Invalid credentials, or account blocked/inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recover/verify:
    post:
      tags:
        - Recover
      summary: Verify recover OTP
      description: Verifies the OTP using the reset password token. Sets the
        reset-authorized flag.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRecoverUserOtpPayload'
      responses:
        '200':
          description: OTP verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token missing/invalid/expired, account
            blocked/inactive, or OTP invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: User not found based on token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recover/reset:
    post:
      tags:
        - Recover
      summary: Reset user password
      description: Resets the password after OTP verification. Blacklists the reset
        token and sends success email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRecoverUserPasswordPayload'
      responses:
        '200':
          description: Password reset successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token missing/invalid/expired, account
            blocked/inactive, or not authorized (OTP not verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: User not found based on token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recover/resend:
    post:
      tags:
        - Recover
      summary: Resend recover OTP
      description: Resends a new OTP for the password reset flow using the reset token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OTP resent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token missing/invalid/expired, or account
            blocked/inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: User not found based on token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: 'Logs out the user from the current device ONLY.

        This invalidates the current device context by setting isActive=false
        and clearing the FCM token,

        stopping notifications for this specific device.

        It also immediately revokes the stateless JWT by adding it to a Redis
        blacklist for its remaining lifetime.

        Other devices logged into the same account remain completely unaffected.

        '
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutPayload'
      responses:
        '200':
          description: Logout successful. The JWT is revoked and the device context is
            inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token missing/expired/revoked, account
            blocked/inactive, or deviceIdentifier mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed (e.g. missing deviceIdentifier).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: Admin Login
      description: Authenticate an admin user, sets secure HttpOnly cookies and CSRF cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginPayload'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthSuccessResponse'
          headers:
            Set-Cookie:
              description: access_token (HttpOnly), refresh_token (HttpOnly), admin_csrf_token
              schema:
                type: string
        '401':
          description: Invalid credentials or account blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Access denied - Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/auth/check:
    post:
      tags:
        - Admin Auth
      summary: Check Admin Authentication Status
      description: Verifies the admin is authenticated using access cookies and CSRF headers
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthSuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: CSRF Token Invalid or Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/auth/refresh:
    post:
      tags:
        - Admin Auth
      summary: Refresh Admin Tokens
      description: Atomically rotates refresh tokens. Requires valid CSRF and refresh
        cookies.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Admin tokens refreshed successfully
                  csrfToken:
                    type: string
                    description: CSRF token provided for easier Swagger testing. Usually sent via
                      cookie.
                  traceId:
                    type: string
                    format: uuid
          headers:
            Set-Cookie:
              description: access_token (HttpOnly), refresh_token (HttpOnly), admin_csrf_token
              schema:
                type: string
        '401':
          description: Invalid or already consumed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: CSRF Token Invalid or Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/auth/logout:
    post:
      tags:
        - Admin Auth
      summary: Admin Logout
      description: Invalidates the current admin session, blacklists access token,
        clears cookies
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Admin logged out successfully
                  traceId:
                    type: string
                    format: uuid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: CSRF Token Invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/change-password:
