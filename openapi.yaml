  /api/v1/connect/status:
    get:
      tags: [Connect]
      summary: Retrieve authoritative sanitized Stripe Connect status
      description: Authenticated CLUB_OWNER operation. Flutter must call this after the browser returns; the return redirect alone does not establish READY.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Connect status.
