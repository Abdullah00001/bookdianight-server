  /api/v1/connect/return:
    get:
      tags: [Connect]
      summary: Stripe Connect browser return
      description: Backend callback only. It validates the opaque callback token, refreshes authoritative account state, then redirects to the configured Flutter HTTPS App Link. It does not itself prove READY.
      parameters:
        - name: token
          in: query
          required: true
          description: Opaque, short-lived callback token generated with the Account Link; it is not a Stripe account ID.
          schema: { type: string, format: uuid }
      responses:
        '303':
          description: Redirect to the configured Flutter HTTPS App Link. Flutter then calls Connect status.
          headers:
            Location:
              description: Configured Flutter App Link.
              schema: { type: string, format: uri }
        '400':
          {
            description: Invalid or expired callback token,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
        '422':
          {
            description: Invalid callback query,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/ValidationErrorResponse' },
                  },
              },
          }
        '500':
          {
            description: Stripe or server error,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
  /api/v1/connect/refresh:
    get:
      tags: [Connect]
      summary: Refresh an expired or consumed Stripe Account Link
      description: Backend callback only. Validates the opaque callback token, reuses the local Connect account, creates a fresh single-use Account Link, and redirects to Stripe. Flutter does not supply a Stripe account ID.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '303':
          description: Redirect to a fresh Stripe onboarding Account Link.
          headers:
            Location:
              description: Single-use Stripe-hosted onboarding URL.
              schema: { type: string, format: uri }
        '400':
          {
            description: Invalid or expired callback token,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
        '422':
          {
            description: Invalid callback query,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/ValidationErrorResponse' },
                  },
              },
          }
        '500':
          {
            description: Stripe or server error,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
  /api/v1/connect/webhook:
    post:
      tags: [Connect]
      summary: Stripe Connect webhook receiver
      description: No user authentication applies. Stripe sends a raw JSON body signed with Stripe-Signature. The receiver accepts account.updated, account.external_account.updated, and capability.updated, and never exposes raw provider payloads through user APIs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe Event JSON. The server verifies the original raw request bytes before parsing.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          { description: Event received and durably processed or deduplicated }
        '500':
          {
            description: Invalid signature,
            payload,
            Stripe,
            or server error,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
