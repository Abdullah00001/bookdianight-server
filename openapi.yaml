paths:
  /api/v1/wishlist:
    post:
      tags:
        - Wishlist
      summary: Add to Wishlist
      description: >
        Adds a Club or Event to the user's wishlist.
        This operation is idempotent: repeating the same save does not create a duplicate and does not return 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistPayload'
      responses:
        '200':
          description: Wishlist updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Target not found or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

    get:
      tags:
        - Wishlist
      summary: Get Wishlist
      description: >
        Retrieves the authenticated user's wishlist.
        Mixed results are ordered by wishlist creation time descending.
        Unavailable or stale saved items (deactivated Clubs, non-UPCOMING Events) are automatically excluded.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
          required: false
          description: Filter wishlist items by type.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
          description: Number of items per page.
      responses:
        '200':
          description: Wishlist retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWishlistResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  '/api/v1/wishlist/{type}/{targetId}':
    delete:
      tags:
        - Wishlist
      summary: Remove from Wishlist
      description: >
        Removes a Club or Event from the user's wishlist.
        Deletion is scoped to the authenticated user.
        Stale wishlist records can still be removed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
        - in: path
          name: targetId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Removed from wishlist successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description:
        Reports the health status of the application and its dependencies
        (Database, Redis).
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: User signup
      description: 'creates a new user account

        validates the submitted registration information

        creates the pending verification state

        generates the verification OTP flow

        returns the OTP-page/pending-verification token

        does not issue a normal authenticated access token until verification
        succeeds

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupPayload'
      responses:
        '201':
          description: Signup successful, OTP email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User with this email already exist
                errorType: USER_ALREADY_EXISTS
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        authenticates using email/password

        requires the app's deviceIdentifier

        resolves/registers the device after successful authentication

        supports multiple devices for the same account

        optionally updates FCM token information

        returns an access JWT for verified users

        uses the existing remember-me behavior

        (7-day token if rememberMe is false, 30-day token if rememberMe is true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login successful. Returns access token or OTP pending token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description:
            'Internal Service Errors (Currently thrown as native Errors caught
            by global 500 handler).

            Includes: "Invalid credentials", "Account is blocked or inactive".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP
      security:
        - bearerAuth: []
      description: 'this endpoint uses the pending OTP verification token

        validates the OTP

        establishes the device relationship

        issues the normal access token after successful verification

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignupPayload'
      responses:
        '200':
          description: OTP Verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized. OTP is invalid, expired, or token missing/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: OTP Expired
                errorType: OTP_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/resend:
    post:
      tags:
        - Auth
      summary: Resend OTP
      security:
        - bearerAuth: []
      description: 'it requires the pending OTP verification token

        generates/sends another verification OTP

        does not issue an access token

        '
      responses:
        '200':
          description: OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token is missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: Token Expired
                errorType: TOKEN_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/check:
    post:
      tags:
        - Auth
      summary: Check Access Token
      security:
        - bearerAuth: []
      description: 'it validates the access token

        validates the JWT/device relationship

        validates the submitted deviceIdentifier

        updates device activity according to the existing implementation

        does not create/reassign device ownership

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAccessPayload'
      responses:
        '200':
          description: User is authenticated and device context is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAccessResponse'
        '401':
          description: Unauthorized. Token missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: Token Expired
                errorType: TOKEN_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Invalid device context, blocked account, or other internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media:
    post:
      tags:
        - Media
      summary: Upload Media
      description: 'multipart file upload

        accepted field name is "files"

        number of files: up to 10

        per-file size limit: 50MB

        accepted MIME categories: standard images, videos, audio, and documents

        returned media URLs

        **Security Warning:** This route is currently PUBLIC and requires no
        authentication.

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  description: Array of files to upload. Max 10. Max 50MB per file.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '400':
          description: Multer Upload Error (File size exceeded, unexpected field, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                  traceId:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Media
      summary: Delete Media
      description: 'deletes the supplied media objects/URLs

        request structure expects a JSON array of URLs

        current authentication state is PUBLIC

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMediaPayload'
      responses:
        '200':
          description: Media items deletion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recover/find:
    post:
      tags:
        - Recover
      summary: Find user by email and send OTP
      description:
        Validates email, checks account status, generates OTP, and sends it
        via email queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindRecoverUserByEmailPayload'
      responses:
        '200':
          description: Success. OTP sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Invalid credentials, or account blocked/inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recover/verify:
    post:
      tags:
        - Recover
